<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

<form action="" method="post" enctype="multipart/form-data">

    <fieldset>
        <legend><b>Registration Form</b></legend>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <br><br>

        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" cols="30"></textarea>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="contact">Contact:</label>
        <input type="tel" id="contact" name="contact">

        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <br><br>

        <label>Course:</label>

        <input type="checkbox" id="wd" name="course" value="WD">
        <label for="wd">WD</label>

        <input type="checkbox" id="sql" name="course" value="SQL">
        <label for="sql">SQL</label>

        <input type="checkbox" id="c" name="course" value="C">
        <label for="c">C</label>

        <input type="checkbox" id="java" name="course" value="JAVA">
        <label for="java">JAVA</label>

        <br><br>

        <label for="sign">Sign:</label>
        <input type="file" id="sign" name="sign">

        <br><br>

        <button type="submit">Submit</button>

    </fieldset>

</form>

</body>
</html>
